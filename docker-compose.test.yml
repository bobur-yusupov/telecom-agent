services:
  postgres-test:
    image: pgvector/pgvector:pg16
    container_name: mirzo-postgres-test
    environment:
      POSTGRES_USER: mirzo_test
      POSTGRES_PASSWORD: mirzo_test
      POSTGRES_DB: mirzo_test
    ports:
      - '5433:5432'
    # tmpfs mounts the data directory in RAM — no disk writes, container is
    # fully ephemeral: data vanishes when the container stops.
    tmpfs:
      - /var/lib/postgresql/data:mode=0700,uid=999,gid=999
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mirzo_test -d mirzo_test']
      interval: 2s
      timeout: 3s
      retries: 20
