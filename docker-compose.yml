services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mirzo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-mirzo}
      POSTGRES_PASSWORD: ${PGPASSWORD:-mirzo}
      POSTGRES_DB: ${PGDATABASE:-mirzo}
    ports:
      - '${PGPORT:-5432}:5432'
    volumes:
      - mirzo-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${PGUSER:-mirzo} -d ${PGDATABASE:-mirzo}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mirzo-pg-data:
